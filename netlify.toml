[build]
  functions = "netlify/functions"

# ── STATIC PAGES ─────────────────────────────────────────────────
[[redirects]]
  from = "/about"
  to = "/about"
  status = 200

[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works"
  status = 200

[[redirects]]
  from = "/recommend"
  to = "/recommend"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy"
