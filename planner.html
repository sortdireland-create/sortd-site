<title>Your free family calendar — sortd</title>
<meta name="description" content="One free calendar for every class, school day off, day out and summer camp. Share it with other parents.">
<meta property="og:title" content="Your family's week, sorted — free Sortd calendar">
<meta property="og:description" content="Every class, school day off, day out and summer camp in one calendar. Free for parents in Ireland.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<body>

<header class="top">
  <div class="wrap">
    <div class="toprow">
      <a href="/" class="brand">sortd<span>.</span></a>
      <div class="topright">
        <span class="savestate" id="savestate" role="status" aria-live="polite"></span>
        <a href="/account" class="toplink">My account</a>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" aria-selected="true" data-view="calendar">Calendar</button>
      <button class="tab" role="tab" aria-selected="false" data-view="plan">Summer</button>
      <button class="tab" role="tab" aria-selected="false" data-view="cal">Summer days</button>
      <button class="tab" role="tab" aria-selected="false" data-view="friends">Friends</button>
      <button class="tab" role="tab" aria-selected="false" data-view="costs">Costs &amp; leave</button>
      <button class="tab" role="tab" aria-selected="false" data-view="how">How it works</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"><p class="loading">Loading your calendar…</p></main>
<div id="layer"></div>

<script src="/js/camps-data.js"></script>
<script src="/js/school-year.js"></script>
